<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4000" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff4000" stop-opacity="0.6"/>
    </linearGradient>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- 바탕 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#222222"/>

  <!-- 오른쪽으로 달려가는 척추뼈 네 개 -->
  <g clip-path="url(#body)">
    <g transform="translate(487 530) skewX(-14) translate(-512 -512)">
      <!-- 속도 잔상 -->
      <g fill="url(#tail)">
        <rect x="150" y="232" width="380" height="34" rx="17"/>
        <rect x="210" y="296" width="320" height="34" rx="17"/>
        <rect x="250" y="412" width="320" height="30" rx="15"/>
        <rect x="300" y="468" width="270" height="30" rx="15"/>
        <rect x="335" y="566" width="280" height="26" rx="13"/>
        <rect x="380" y="614" width="235" height="26" rx="13"/>
        <rect x="420" y="706" width="240" height="22" rx="11"/>
        <rect x="455" y="746" width="205" height="22" rx="11"/>
      </g>
      <!-- 척추뼈 -->
      <g fill="#ff4000">
        <rect x="-160" y="-78" width="320" height="156" rx="66" transform="translate(600 281) rotate(-3)"/>
        <rect x="-128" y="-64" width="256" height="128" rx="54" transform="translate(622 455) rotate(3)"/>
        <rect x="-98" y="-51" width="196" height="102" rx="44" transform="translate(648 603) rotate(-5)"/>
        <rect x="-72" y="-39" width="144" height="78" rx="34" transform="translate(672 737) rotate(2)"/>
      </g>
    </g>
  </g>
</svg>
