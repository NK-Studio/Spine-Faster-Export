# v* 태그를 푸시하면 macOS(Apple Silicon, DMG)·Windows(x64, 설치 프로그램) 빌드를 GitHub 릴리스에 올린다.
# 수동 실행(workflow_dispatch)은 빌드만 하고 결과물을 Actions 아티팩트로 남긴다.
name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # 앱이 새 판을 확인하는 매니페스트 주소(예: https://quick-spine.<계정>.workers.dev/manifest.json). 비어 있으면 앱은 업데이트를 확인하지 않는다.
  # 빌드에 묻히고(src-tauri/src/updater.rs), 아래 update-site 작업이 이 주소의 사이트(site/, Cloudflare Workers)에 manifest.json 을 올린다.
  QUICK_SPINE_UPDATE_URL: ${{ vars.QUICK_SPINE_UPDATE_URL }}

jobs:
  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-15 # arm64 러너
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: latest, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace --exclude spine-faster-export --release
      # ChangeLog.md 맨 위 버전 = 앱 버전, 업데이트 매니페스트 만들기
      - run: node tests/changelog.test.mjs
      - run: node tests/update-manifest.test.mjs

      # Developer ID 인증서(.p12, base64)가 시크릿에 있으면 Tauri 가 그것으로 앱·DMG 를 서명하고,
      # App Store Connect API 키까지 있으면 앱을 공증한다. 없으면 ad-hoc 서명만 한다
      # (Apple Silicon 은 서명 없는 앱을 실행하지 않는다).
      - name: Signing setup
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # 시크릿 이름: APPLE_API_KEY_P8 = .p8 파일 내용, APPLE_API_KEY = 키 ID
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::warning::APPLE_CERTIFICATE 시크릿이 없어 ad-hoc 서명합니다(공증 안 함)"
            exit 0
          fi
          echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            {
              # Tauri 는 APPLE_API_KEY 에 키 ID 를, APPLE_API_KEY_PATH 에 .p8 경로를 받는다.
              echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
              echo "NOTARIZE=1"
            } >> "$GITHUB_ENV"
          fi

      # 끌어다 놓아 설치하는 DMG(왼쪽 Quick Spine → 오른쪽 Applications, 화살표 배경).
      # 창 배치는 src-tauri/tauri.conf.json 의 bundle.macOS.dmg. Tauri 는 CI 에서 Finder 배치를 건너뛰므로 끈다.
      - name: Build Quick Spine.app + DMG
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Notarize DMG
        if: env.NOTARIZE == '1'
        run: |
          DMG=$(ls target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"
          spctl -a -vv -t open --context context:primary-signature "$DMG"

      - name: Collect
        run: |
          mkdir -p out
          cp target/aarch64-apple-darwin/release/bundle/dmg/*.dmg "out/QuickSpine-${{ github.ref_name }}-macos-arm64.dmg"
          codesign -dv "target/aarch64-apple-darwin/release/bundle/macos/Quick Spine.app" 2>&1 | grep -E 'Authority|Signature' || true
          ls -la out
      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: out/*

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: latest, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace --exclude spine-faster-export --release
      - name: Build installers
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi
      - name: Collect
        shell: bash
        run: |
          B=target/x86_64-pc-windows-msvc/release/bundle
          mkdir -p out
          cp "$B"/nsis/*-setup.exe "out/QuickSpine-${{ github.ref_name }}-windows-x64-setup.exe"
          cp "$B"/msi/*.msi "out/QuickSpine-${{ github.ref_name }}-windows-x64.msi"
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: out/*

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v3
        with:
          name: Quick Spine ${{ github.ref_name }}
          files: out/*
          generate_release_notes: true
          body: |
            ## 내려받기

            | OS | 파일 |
            | --- | --- |
            | macOS (Apple Silicon, macOS 11 이상) | `QuickSpine-${{ github.ref_name }}-macos-arm64.dmg` |
            | Windows 10/11 (x64) | `QuickSpine-${{ github.ref_name }}-windows-x64-setup.exe` (또는 `.msi`) |

            설치한 Quick Spine 은 다음 버전부터 앱 안에서 새 버전을 알려 주고 바로 업데이트합니다(설정 › 일반 › 업데이트).

            ### macOS 설치
            DMG 를 열고 창 안의 `Quick Spine` 을 옆의 `Applications` 폴더로 끌어다 놓으면 설치됩니다.
            Developer ID 서명이 없는 빌드라면 처음 열 때 막히니, **시스템 설정 → 개인정보 보호 및 보안 → 그래도 열기** 를 누르세요.

            ### Windows 설치
            SmartScreen 경고가 뜨면 **추가 정보 → 실행** 을 누르세요. Windows 10/11 에 기본 포함된 WebView2 런타임을 씁니다.

  # 앱 업데이트: 매니페스트(최신 + 아래 두 판)를 site/manifest.json 으로 만들어 main 에 커밋한다. Cloudflare Workers Builds 가
  # 이 저장소(GitHub 연결)의 main 을 보고 있다가 site/ 를 배포한다(wrangler.jsonc). 그 뒤 매니페스트에서 빠진 옛 GitHub 릴리스를
  # 지운다(태그는 남긴다). 저장소 변수 QUICK_SPINE_UPDATE_URL 이 있을 때만 돈다.
  update-site:
    name: Publish update manifest
    if: startsWith(github.ref, 'refs/tags/v') && vars.QUICK_SPINE_UPDATE_URL != ''
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write # 매니페스트 커밋·옛 릴리스 지우기
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Build manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PREV="$RUNNER_TEMP/previous.json"
          # 변경 기록은 태그 시점의 ChangeLog.md 에서 뽑는다(main 이 그 뒤로 더 나갔을 수 있다).
          git fetch --depth=1 origin "refs/tags/$GITHUB_REF_NAME"
          git show "FETCH_HEAD:ChangeLog.md" > "$RUNNER_TEMP/ChangeLog.md"
          notes() { awk -v v="$1" '/^## \[/ { if (on) exit; on = index($0, "## [" v "]") == 1; next } on { print }' "$RUNNER_TEMP/ChangeLog.md" | sed '/./,$!d'; }
          notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          # 저장소에 있는 매니페스트에서 이전 판들을 이어 받는다.
          if [ -f site/manifest.json ]; then cp site/manifest.json "$PREV"; else echo '{}' > "$PREV"; fi
          # 처음 올릴 때는 매니페스트가 없다 — 직전 두 릴리스의 설치 파일을 받아 해시를 재고 먼저 넣는다(안 그러면 아래 단계가 그 릴리스들을 지운다).
          if ! node -e "const m=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));process.exit((m.releases||[]).length?0:1)" "$PREV"; then
            for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | grep '^v' | grep -vx "$GITHUB_REF_NAME" | sort -V -r | head -2 | sort -V); do
              old="$RUNNER_TEMP/old/$tag"
              mkdir -p "$old"
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" -D "$old" -p '*-macos-arm64.dmg' -p '*-windows-x64-setup.exe' -p '*-windows-x64.msi' || continue
              notes "${tag#v}" > "$old.md"
              date=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt[0:10]')
              node scripts/update-manifest.mjs --version "${tag#v}" --date "$date" --repo "$GITHUB_REPOSITORY" --dist "$old" --notes "$old.md" --previous "$PREV" --keep 3 --out "$RUNNER_TEMP/seed/manifest.json" || continue
              cp "$RUNNER_TEMP/seed/manifest.json" "$PREV"
            done
          fi
          node scripts/update-manifest.mjs \
            --version "$VERSION" --repo "$GITHUB_REPOSITORY" --dist out \
            --notes "$RUNNER_TEMP/notes.md" --previous "$PREV" \
            --page "${QUICK_SPINE_UPDATE_URL%manifest.json}" --keep 3 \
            --out "$RUNNER_TEMP/manifest/manifest.json"
          cp "$RUNNER_TEMP/manifest/manifest.json" site/manifest.json
          cat site/manifest.json
      # 이 커밋을 Cloudflare 가 받아 배포한다. GITHUB_TOKEN 으로 푸시한 커밋은 워크플로를 다시 돌리지 않는다.
      - name: Commit manifest to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/manifest.json
          git diff --cached --quiet && { echo "바뀐 것 없음"; exit 0; }
          git commit -m "Publish update manifest for $GITHUB_REF_NAME"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
      # 매니페스트에 남은 판(최신 + 아래 두 판)의 릴리스만 둔다. git 태그는 지우지 않는다.
      - name: Remove older GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP="$RUNNER_TEMP/manifest/keep.txt"
          cat "$KEEP"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | while read -r tag; do
            case "$tag" in v*) ;; *) continue ;; esac
            if ! grep -qx "$tag" "$KEEP"; then
              echo "지움: $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done
